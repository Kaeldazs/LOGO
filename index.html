    <body>
        <button onclick="itpr.toggle();" style="position: absolute; z-index: 999; top: 20px; left: 20px;">Play/Pause</button>

        <button onclick="itpr.speed(0)" style="position: absolute; z-index: 999; top: 90px; left: 20px;">Speed max</button>
        <button onclick="itpr.clear(true)" style="position: absolute; z-index: 999; top: 120px; left: 20px;">CLEAR</button>
